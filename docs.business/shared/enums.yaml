# Enums tập trung - source of truth cho các value set dùng trong domain.yaml.

registry_status:
  description: >
    Trạng thái vòng đời của một bản ghi Registry (App/Service/Domain/Resource).
    Deprecated dùng để báo hiệu sắp ngừng dùng nhưng vẫn đọc được, trước khi chuyển hẳn sang Inactive.
  values:
    - Active
    - Inactive
    - Deprecated

app_service_role:
  description: >
    Vai trò của Service đối với App trong AppServiceMapping. Primary là service chính của App -
    quyền thuộc Service Primary quyết định App có hiện trong list_my_apps; Dependency là service
    phụ trợ App có gọi tới (IAM, Asset Service...).
  values:
    - Primary
    - Dependency
